name: poc-kafka

services:

  mongo:
    image: mongo:9
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper): the same process is broker and controller.
  # Listeners: PLAINTEXT (kafka:9092) for containers, EXTERNAL (localhost:9094) for the host.
  # No volume: topics and records are lost when the container is removed.
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
      target: dev
    container_name: poc-kafka
    environment:
      MONGODB_URI: mongodb://mongo:27017/poc
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s
    volumes:
      - .:/app
      - app-target:/app/target
      - maven-repo:/root/.m2
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Azure CLI + Terraform shell for infra/. Behind a profile, so "docker compose up" skips it.
  infra:
    profiles: ["infra"]
    build:
      context: .
      dockerfile: docker/infra.Dockerfile
    working_dir: /app/infra
    volumes:
      - .:/app
      # Jar built by the app/ide containers, for manual deploys
      - app-target:/app/target:ro
      # Keeps the "az login" session between runs
      - azure-cli:/home/infra/.azure

  # Security scan (dependency CVEs, Dockerfile/Terraform misconfigurations, secrets): docker compose run --rm trivy
  trivy:
    profiles: ["tools"]
    image: aquasec/trivy:0.76.0
    working_dir: /app
    command: ["fs", "--config", "trivy.yaml", "--skip-version-check", "."]
    volumes:
      - .:/app:ro
      - trivy-cache:/root/.cache/trivy
      # Maven cache filled by the app/ide containers: Trivy resolves the dependency tree from it
      # instead of downloading every POM from Maven Central (which rate-limits with HTTP 429)
      - maven-repo:/root/.m2:ro

volumes:
  azure-cli:
  trivy-cache:
  mongo-data:
  app-target:
  maven-repo:
