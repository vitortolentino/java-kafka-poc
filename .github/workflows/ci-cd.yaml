name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same MongoDB the tests use locally; Kafka runs embedded in the test JVM
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Tests + Spotless (formatting) + SpotBugs/FindSecBugs (static analysis), all bound to "verify"
      - name: Test, check and package
        run: mvn -B verify

      - uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/poc-kafka-*.jar
          retention-days: 7

  # Conventional Commits, same script as the local commit-msg hook (catches commits made with --no-verify)
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # First push of a branch has no "before": check only the last commit
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            commits="$HEAD"
          else
            commits="$(git rev-list --no-merges "$BASE..$HEAD")"
          fi
          status=0
          for sha in $commits; do
            bash scripts/check-commit-msg.sh --text "$(git log -1 --format=%B "$sha")" || status=1
          done
          exit $status

  # Dependency CVEs, Dockerfile/Terraform misconfigurations and secrets (config in trivy.yaml)
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@v7

      # Fill ~/.m2 (cached between runs) so Trivy reads the dependency tree locally:
      # downloading every POM from Maven Central gets rate-limited (HTTP 429)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve dependencies
        run: mvn -B -q dependency:resolve

      - name: Trivy report (SARIF)
        run: >-
          docker run --rm -v "$PWD:/app" -v "$HOME/.m2:/root/.m2:ro" -w /app aquasec/trivy:0.76.0
          fs --config trivy.yaml --skip-version-check --format sarif --output trivy.sarif --exit-code 0 .

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Trivy gate (fails on HIGH/CRITICAL)
        run: >-
          docker run --rm -v "$PWD:/app" -v "$HOME/.m2:/root/.m2:ro" -w /app aquasec/trivy:0.76.0
          fs --config trivy.yaml --skip-version-check .

  deploy:
    needs: [build, security]
    # Skipped until the Azure variables exist (see infra/README.md), so the first pushes stay green
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    # Must match the subject of the federated credential in infra/github.tf
    environment: production
    permissions:
      id-token: write # lets the job request the OIDC token used by azure/login
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-jar

      # No password: Azure trusts the GitHub-signed token (values come from terraform output)
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: poc-kafka-*.jar
