name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same MongoDB the tests use locally; Kafka runs embedded in the test JVM
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test and package
        run: mvn -B verify

      - uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/poc-kafka-*.jar
          retention-days: 7

  deploy:
    needs: build
    # Skipped until the Azure variables exist (see infra/README.md), so the first pushes stay green
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    # Must match the subject of the federated credential in infra/github.tf
    environment: production
    permissions:
      id-token: write # lets the job request the OIDC token used by azure/login
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-jar

      # No password: Azure trusts the GitHub-signed token (values come from terraform output)
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: poc-kafka-*.jar
