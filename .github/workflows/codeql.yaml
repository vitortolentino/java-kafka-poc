name: CodeQL

# GitHub's semantic code analysis (SAST): finds security issues by following data flow,
# e.g. request input reaching a query or a log. Results go to the Security tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches new queries on unchanged code

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # CodeQL watches this compilation; checks and tests already run in ci-cd.yaml
      - name: Compile
        run: mvn -B -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true package

      - uses: github/codeql-action/analyze@v4
